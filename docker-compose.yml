version: "3.8"

services:
  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./client:/track-mix-app/client
    stdin_open: true
    tty: true

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
    volumes:
      - ./server:/track-mix-app/server
    stdin_open: true
    tty: true